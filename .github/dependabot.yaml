version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    # A dependency goes into the first group it matches. Major bumps match no
    # group and get a PR each.
    groups:
      # pdf-extract's API takes lopdf types, so both must move together.
      pdf:
        patterns: [lopdf, pdf-extract]
      cargo-minor:
        update-types: [minor]
      cargo-patch:
        update-types: [patch]
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
