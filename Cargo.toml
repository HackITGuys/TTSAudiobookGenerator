[package]
name = "tts-audiobook-generator"
version = "0.1.0"
edition = "2024"
description = "Offline converter from PDF/EPUB/DOCX books to chaptered TTS audiobooks"
license = "MIT"

[[bin]]
name = "tts-audiobook"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.23.1"
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15.7"
pdf-extract = "0.12"
regex = "1"
roxmltree = "0.21"
scraper = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slug = "0.1"
ureq = { version = "3", features = ["json"] }
zip = { version = "9", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
